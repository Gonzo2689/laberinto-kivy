name: Build APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: Digreatbrian/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer android debug